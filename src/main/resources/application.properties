spring.application.name=student-support-agent

server.port=8080

# H2 DATABASE
spring.datasource.url=jdbc:h2:file:./data/student-support-db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 CONSOLE
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JSON
spring.jackson.serialization.indent-output=true

# MICROSOFT FOUNDRY AGENT
foundry.project-endpoint=https://nodefix-resource.services.ai.azure.com/api/projects/nodefix
foundry.agent-name=nodefix1